<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .child{
            
            padding: 20px;
        }
        .parent{
            display: grid;
            grid-template-areas:' a a b ' 'c d e ' 'f g g ' ;
        }
        img{
            width: 100%;
            height: 500px;
        }
        .a{
            grid-area: a;
        }

        .b{
            grid-area: b;
        }
        .c{
            grid-area: c;
        }
        .d{
            grid-area: d;
        }
        .e{
            grid-area: e;
        }
        .f{
            grid-area: f;
        }
        .g{
            grid-area: g;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child a">
            <img src="https://nepalwanders.com/wp-content/uploads/2023/08/mteverf-1.jpg">
            <h2>MT everest</h2>
        </div>
        <div class="child b">
            <img src="https://nepalwanders.com/wp-content/uploads/2023/08/Pokharabeauty-1.jpg">
        </div>
        <div class="child c">
            <img src="https://nepalwanders.com/wp-content/uploads/2023/08/Untitleddolpo-1.jpg">
        </div>
        <div class="child d">
            <img src="https://nepalwanders.com/wp-content/uploads/2023/08/manasluganesh-ght-wildlife-1-1.jpeg">
        </div>
        <div class="child e">
            <img src="https://nepalwanders.com/wp-content/uploads/2023/08/choose-2560-1-1.jpg">
        </div>
        <div class="child f">
            <img src="https://nepalwanders.com/wp-content/uploads/2023/08/mardihimalannapurnanew-1.jpg">
        </div>
        <div class="child g">
            <img src="https://nepalwanders.com/wp-content/uploads/2023/08/gauri-shanker-rolwaling-langtang-helambu-1.jpg">
        </div>
    </div>
</body>
</html>
