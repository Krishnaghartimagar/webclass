<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .child{

            border: 2px solid black;
            padding: 40px;
        }
        .parent{
            display: grid;
            grid-template-areas:' a a a a'  '. b b b' 'c c d e' 'c c f e' ;
            /* if we need empty we can . */
        }
        .a{
            grid-area: a;
        }
        .b{
            grid-area: b;
        }
        .c{
            grid-area: c;
        }
        .d{
            grid-area: d;
        }
        .e{
            grid-area: e;
        }
        .f{
            grid-area: f;
        }

    </style>
</head>
<body>
    <div class="parent">
        <div class="child a">A</div>
        <div class="child b">B</div>
        <div class="child c">C</div>
        <div class="child d">D</div>
        <div class="child e">E</div>
        <div class="child f">F</div>
    </div>
    
</body>
</html>
