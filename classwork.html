<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .child{
            border: 1px solid black;
            padding: 20px;
        }
        .parent{
            display: grid;
            grid-template-areas:'a a a a a a' '. b b b c .' '. d d e e . ' 'f f f f f f' ;
        }
        .a{
            grid-area: a;
        }
        .b{
            grid-area: b;
        }
        .c{
            grid-area: c;
        }
        .d{
            grid-area: d;
        }
        .e{
            grid-area: e;
        }
        .f{
            grid-area: f;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child a">A</div>
        <div class="child b">B</div>
        <div class="child c">C</div>
        <div class="child d">D</div>
        <div class="child e">E</div>
        <div class="child f">F</div>
    </div>
</body>
</html>
