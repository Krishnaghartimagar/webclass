<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{ margin: 0; padding: 0; box-sizing: border-box;}
        ul{ margin: 80px; list-style: none;}
        li{ position: relative ; border-bottom: 2px solid #999; padding-bottom: 10px;}
        li::before{ content: ''; width: 10px; height: 10px;  border: 1px solid #000; border-radius: 50%; position: absolute; left: -18px; top: 0; background: #fff; z-index: 999;}
        li::after{ content: ''; width: 2px; height: 100%; background: #000; position: absolute; left: -15px; top: 0;}
        li:first-child::before{ background: black;}
    </style>
</head>
<body>
    <ul>
        <li>
            <span>४१ मिनेट अगाडि | विश्व</span>
            <h4>कफिनमै जीवित भेटिइन् थाई महिला</h4>
        </li>
         <li>
            <span>४१ मिनेट अगाडि | विश्व</span>
            <h4>कफिनमै जीवित भेटिइन् थाई महिला</h4>
        </li>
    </ul>
</body>
</html>
